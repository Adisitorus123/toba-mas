apiVersion: batch/v1
kind: Job
metadata:
  name: toba-mas-db-reseed
  namespace: toba-mas
  labels:
    app: toba-mas-db-reseed
spec:
  template:
    metadata:
      labels:
        app: toba-mas-db-reseed
    spec:
      restartPolicy: OnFailure
      containers:
      - name: db-reseed
        image: postgres:15-alpine
        command: 
        - sh
        - -c
        - |
          set -e
          echo "Waiting for PostgreSQL to be ready..."
          until pg_isready -h $DB_HOST -p $DB_PORT -U $DB_USER; do
            echo "PostgreSQL is not ready yet. Retrying in 5 seconds..."
            sleep 5
          done
          echo "PostgreSQL is ready!"
          echo ""
          echo "⚠️  Truncating existing seed tables..."
          psql $DATABASE_URL -c "TRUNCATE TABLE about_company, portfolios, contact_settings RESTART IDENTITY CASCADE;"
          echo "✅ Tables truncated."
          echo ""
          echo "📦 Running migration from 001_init.sql..."
          psql $DATABASE_URL -f /migrations/001_init.sql
          echo ""
          echo "✅ Migration completed!"
          echo ""
          echo "🔍 Verifying data..."
          psql $DATABASE_URL -c "SELECT 'about_company' as table_name, COUNT(*) as row_count FROM about_company UNION ALL SELECT 'portfolios', COUNT(*) FROM portfolios UNION ALL SELECT 'contact_settings', COUNT(*) FROM contact_settings;"
          echo ""
          echo "📞 WhatsApp number:"
          psql $DATABASE_URL -c "SELECT value FROM contact_settings WHERE key = 'whatsapp';"
        envFrom:
        - secretRef:
            name: toba-mas-db-secret
        - configMapRef:
            name: toba-mas-config
        env:
        - name: DATABASE_URL
          value: "postgresql://$(DB_USER):$(DB_PASSWORD)@$(DB_HOST):$(DB_PORT)/$(DB_NAME)?sslmode=require"
        volumeMounts:
        - name: migrations
          mountPath: /migrations
      volumes:
      - name: migrations
        configMap:
          name: toba-mas-migrations
  backoffLimit: 2
