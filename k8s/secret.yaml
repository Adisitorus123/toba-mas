# ⚠️ PERINGATAN KEAMANAN ⚠️
# File ini hanya berisi PLACEHOLDER. JANGAN PERNAH mengganti password di bawah
# dengan password asli dan melakukan commit ke GitHub!
#
# CARA PAKAI YANG BENAR:
# 1. Ubah DB_PASSWORD di file ini dengan password RDS yang asli (lokal saja)
# 2. Jalankan: kubectl apply -f k8s/secret.yaml
# 3. Kembalikan ke placeholder ini sebelum commit
# 4. Password asli hanya tersimpan di Kubernetes cluster (etcd terenkripsi)
#
# Lihat README.md bagian "Apply Kubernetes Secret ke Cluster" untuk panduan lengkap.

apiVersion: v1
kind: Secret
metadata:
  name: toba-mas-db-secret
  namespace: toba-mas
type: Opaque
stringData:
  # PLACEHOLDER - Ganti saat apply ke cluster, jangan commit password asli!
  DB_USER: "dbadmin"
  DB_PASSWORD: "YourStrongPassword123!"
