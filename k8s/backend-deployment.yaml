apiVersion: apps/v1
kind: Deployment
metadata:
  name: toba-mas-backend
  namespace: toba-mas
  labels:
    app: toba-mas-backend
    version: v1
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: toba-mas-backend
  template:
    metadata:
      labels:
        app: toba-mas-backend
        version: v1
    spec:
      containers:
      - name: backend
        image: ${{ secrets.AWS_ACCESS_KEY_ID }}.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/toba-mas-backend
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        envFrom:
        - secretRef:
            name: toba-mas-db-secret
        - configMapRef:
            name: toba-mas-config
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 20
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 20
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          runAsNonRoot: true
          runAsUser: 1001
          capabilities:
            drop:
            - ALL
